name: Preserve portfolio media

# The initial migration can be completed using the GitHub connection without
# placing a personal access token on another machine. Original files are verified
# against the captured hashes, then committed to this same repository.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preserve-portfolio.yml'
      - 'scripts/restore-preserved-media.py'

permissions:
  contents: write

concurrency:
  group: preserve-portfolio-media
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare media tools
        run: |
          python -m pip install Pillow==12.3.0
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Restore and verify every original
        run: python scripts/restore-preserved-media.py
      - name: Generate efficient display images and animations
        run: python scripts/optimize_media.py
      - name: Build and verify the complete portfolio
        run: |
          npm ci
          npm run build
          npm run check
          python scripts/restore-preserved-media.py --verify-only
      - name: Commit the preserved files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media content/site.json content/media-variants.json archive/adobe/metadata docs/build-inventory.json
          git add archive/adobe/video/fb-v12
          if ! git diff --cached --quiet; then
            git -c core.compression=1 commit -m 'Preserve all original portfolio media and verified web derivatives'
            git -c pack.threads=2 push origin HEAD:main
          fi
